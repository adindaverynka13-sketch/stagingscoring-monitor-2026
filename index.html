<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Leader Score 2026</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1a1d23;--mute:#667085;--line:#e4e7ec;--bar:#2563eb;--ok:#16a34a}
@media(prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c24;--text:#eef0f4;--mute:#98a2b3;--line:#2a303c;--bar:#60a5fa;--ok:#4ade80}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
main{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:28px 0 10px}
.sub{color:var(--mute);margin:0 0 16px}
.ctrl{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.ctrl label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
select,input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi,.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi b{display:block;font-size:28px;margin-top:2px}.kpi span{color:var(--mute);font-size:13px}
.card{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--mute);font-weight:600}
tr:last-child td{border-bottom:0}
.bar{height:8px;background:var(--line);border-radius:4px;min-width:90px}.bar i{display:block;height:100%;border-radius:4px;background:var(--bar)}
.bar.ok i{background:var(--ok)}
.note{color:var(--mute);font-size:12px;margin-top:20px}
.cmp{display:grid;grid-template-columns:minmax(120px,230px) 1fr;gap:6px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.cmp:last-child{border-bottom:0}.cmp .nm{font-weight:600;font-size:13px}
.row{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center;font-size:12px;color:var(--mute)}
.row b{color:var(--text);text-align:right;font-weight:600}
.c1 i{background:#2563eb}.c2 i{background:#f59e0b}.c3 i{background:#8b5cf6}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-bottom:6px}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;background:var(--c)}
</style>
</head>
<body>
<main>
  <h1>Dashboard Leader Score 2026</h1>
  <p class="sub">Ringkasan nilai (Score Total) per regional, nasional, dan kategori staging.</p>

  <div class="ctrl">
    <label>Kategori
      <select id="fKat"><option value="">Semua</option></select>
    </label>
    <label>Batas lulus (%): nilai &gt; batas
      <input id="thr" type="number" step="0.01" value="74.99" style="width:120px">
    </label>
  </div>

  <div class="kpis" id="kpis"></div>

  <h2>Per Regional</h2>
  <div class="card"><table id="tReg"></table></div>

  <h2>Per Kategori (Cluster / Reguler)</h2>
  <div class="card"><table id="tKat"></table></div>

  <h2>Rata-rata per Komponen Skor (skala 0-10)</h2>
  <div class="card" id="comp"></div>

  <h2>Rata-rata per Komponen Skor (skala 0-10)</h2>
  <div class="card" id="comp"></div>

  <p class="note" id="note"></p>
</main>

<script src="data.js"></script>
<script>
const fmt = n => n.toLocaleString("id-ID",{minimumFractionDigits:2,maximumFractionDigits:2});

function stats(rows, thr){
  const sc = rows.filter(r => r.score !== null).map(r => r.score);
  const n = sc.length, pass = sc.filter(s => s > thr).length;
  return {n, pass, avg: n ? sc.reduce((a,b)=>a+b,0)/n : 0,
          pct: n ? pass/n*100 : 0, empty: rows.length - n};
}

function groupTable(el, rows, key, label, thr){
  const groups = [...new Set(rows.map(r => r[key]))].sort();
  let h = `<tr><th>${label}</th><th>Dinilai</th><th>Rata-rata</th><th></th><th>Lulus</th><th>% Lulus</th><th></th></tr>`;
  for (const g of groups){
    const s = stats(rows.filter(r => r[key] === g), thr);
    h += `<tr><td>${g}</td><td>${s.n}</td><td>${fmt(s.avg)}%</td>
      <td><div class="bar"><i style="width:${s.avg}%"></i></div></td>
      <td>${s.pass}</td><td>${fmt(s.pct)}%</td>
      <td><div class="bar ok"><i style="width:${s.pct}%"></i></div></td></tr>`;
  }
  el.innerHTML = h;
}


function avgOf(rows,k){const v=rows.map(r=>r[k]).filter(x=>x!==null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0}
function compChart(el, rows){
  const comps=[["fm","First Mile","c1"],["lm","Last Mile","c2"],["ph","Product Handling","c3"]];
  const groups=["Nasional",...[...new Set(rows.map(r=>r.region))].sort()];
  let h=`<div class="legend"><span style="--c:#2563eb">First Mile</span><span style="--c:#f59e0b">Last Mile</span><span style="--c:#8b5cf6">Product Handling</span></div>`;
  for(const g of groups){
    const sub=g==="Nasional"?rows:rows.filter(r=>r.region===g);
    h+=`<div class="cmp"><div class="nm">${g}</div><div>`;
    for(const [k,l,c] of comps){const a=avgOf(sub,k);
      h+=`<div class="row"><span>${l}</span><div class="bar ${c}"><i style="width:${a*10}%"></i></div><b>${fmt(a)}</b></div>`}
    h+=`</div></div>`;
  }
  el.innerHTML=h;
}

function render(){
  const thr = parseFloat(document.getElementById("thr").value) || 0;
  const kat = document.getElementById("fKat").value;
  const rows = kat ? DATA.filter(r => r.kategori === kat) : DATA;
  const s = stats(rows, thr);

  document.getElementById("kpis").innerHTML = `
    <div class="kpi"><span>Rata-rata nasional</span><b>${fmt(s.avg)}%</b></div>
    <div class="kpi"><span>Lulus nasional (&gt; ${fmt(thr)}%)</span><b>${s.pass} <small style="font-size:15px;color:var(--mute)">/ ${s.n} (${fmt(s.pct)}%)</small></b></div>
    <div class="kpi"><span>Leader sudah dinilai</span><b>${s.n}</b></div>
    <div class="kpi"><span>Belum ada nilai</span><b>${s.empty}</b></div>`;

  groupTable(document.getElementById("tReg"), rows, "region", "Regional", thr);
  compChart(document.getElementById("comp"), rows);
  groupTable(document.getElementById("tKat"), DATA, "kategori", "Kategori", thr);
  document.getElementById("note").textContent =
    "Tabel kategori selalu menampilkan semua data. Leader tanpa nilai tidak dihitung dalam rata-rata maupun persentase lulus.";
}

const sel = document.getElementById("fKat");
[...new Set(DATA.map(r => r.kategori))].sort().forEach(k => sel.add(new Option(k, k)));
sel.onchange = render; document.getElementById("thr").oninput = render;
render();
</script>
</body>
</html>
